name: Daily Bonus

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    env:
      V2EX_COOKIES: ${{ secrets.V2EX_COOKIES }}
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
      YAMIBO_COOKIES: ${{ secrets.YAMIBO_COOKIES }}
      YURIFANS_EMAIL: ${{ secrets.YURIFANS_EMAIL }}
      YURIFANS_PASSWORD: ${{ secrets.YURIFANS_PASSWORD }}
      PICA_USERNAME: ${{ secrets.PICA_USERNAME }}
      PICA_PASSWORD: ${{ secrets.PICA_PASSWORD }}
      UMA_COOKIES: ${{ secrets.UMA_COOKIES }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_USER_ID: ${{ secrets.TG_USER_ID }}

    steps:
      - name: Check if already run today
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          RUNS=$(gh api repos/${{ github.repository }}/actions/workflows/checkin.yml/runs \
            --jq "[.[] | select(.created_at[:10] == \"$TODAY\" and .id != ${{ github.run_id }})] | length")
          echo "Already run today: $RUNS"
          if [ "$RUNS" -gt 0 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repo
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Set timezone
        if: steps.check.outputs.skip != 'true'
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: Echo current time
        if: steps.check.outputs.skip != 'true'
        run: timedatectl

      - name: Install uv and Python 3.13
        if: steps.check.outputs.skip != 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: uv sync

      - name: Check-in
        if: steps.check.outputs.skip != 'true'
        run: uv run python ./message.py